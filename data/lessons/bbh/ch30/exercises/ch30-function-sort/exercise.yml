name: Chapter 30 — Piel Semantic Function Sorting
description: 'A 25-item semantic classification exercise covering the five Piel functions:
  Intensive, Factitive, Declarative, Simple Action, and Denominative. All forms are
  drawn from attested OT texts (Genesis 1–43, Exodus 19, Leviticus 4 and 21, Psalm
  113). For each item the student identifies the function and records the code (I
  / F / D / SA / DN) in the answer field; clicking ▶ Answer reveals the function,
  the Qal meaning of the root, and the one-sentence reasoning. The answer key includes
  a function summary table showing how the 25 items distribute across all five categories.
  Four discussion questions invite comparison across items and focus on the Factitive–Intensive
  distinction for stative roots, the Simple Action category, and the lone Denominative
  form לְכַפֵּר.'
