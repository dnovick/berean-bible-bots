name: '"Stem Identification Drill" — Ch12 Introduction to Aramaic Verbs'
description: This exercise presents fourteen underlined verbs drawn from Daniel and
  Ezra. For each verb, students identify the stem (Peal, Peil, Ithpeel, Pael, Ithpaal,
  Haphel, Hophal, Shaph'el, or Ithhaph'al), isolate the three-letter root, and give
  an English gloss. The drill uses only vocabulary verbs introduced in Chapter 12
  or previously known forms; no paradigm knowledge beyond the diagnostic markers in
  BBA §12 is required.
