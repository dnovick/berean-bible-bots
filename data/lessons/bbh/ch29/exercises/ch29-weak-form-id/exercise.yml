name: '"Weak-Form Identification Drill" — Exercise'
description: A 40-item identification and parsing exercise covering six Hophal weak
  classes (I-yod/vav, Biconsonantal/hollow, I-nun, III-he, I-guttural, Geminate).
  Part A (items 1–30) groups forms by class — five items per class — so students can
  build class-by-class recognition before mixing. Part B (items 31–40) presents forms
  from multiple classes in random order; students must identify the weak class first,
  then parse. Answer keys for both parts include the diagnostic marker that reveals
  the weak class. Five discussion questions focus on the key distinction between classes
  that share the שׁוּרֶק prefix vowel (I-yod/vav and Biconsonantal) and on the I-nun
  assimilation pattern.
