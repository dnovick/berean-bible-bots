name: ch25-qal-niphal-contrast
description: '*BBH Chapter 25 · Niphal Weak Verbs*


  A 15-item exercise in three parts organized by weak-root class. Students are given
  a root with its Qal meaning and an attested Niphal form, then asked to translate
  the Niphal, name its semantic function (Passive / Reflexive / Simple Action / Stative
  Niphal), and explain how the Niphal meaning relates to the Qal. Part A covers I-נ
  roots (נפל, נגש, נגד, נגע, נכה); Part B covers III-ה roots (גלה, עלה, ראה, בנה,
  עשׂה); Part C covers hollow roots (קום, כון, שׁים, בוא, שׁוב).'
