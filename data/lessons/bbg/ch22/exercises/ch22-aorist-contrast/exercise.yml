name: First vs. Second Aorist Contrast Drill
description: A 20-item contrast drill presenting a mix of 1st and 2nd aorist active
  indicative forms. Students identify the aorist type (1st or 2nd), parse person and
  number, supply the lexical form, and translate. The exercise includes 10 first aorists
  and 10 second aorists, with particular attention to verbs with irregular 2nd aorist
  stems (ἔρχομαι, λαμβάνω, βάλλω, ἀποθνῄσκω, γίνομαι, εὑρίσκω, ἄγω). An answer key
  is embedded in all three formats.
