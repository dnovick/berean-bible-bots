name: '"Adjective Parsing Drill" — Exercise'
description: A 20-item parsing drill covering 2-1-2 Greek adjectives in context. Students
  parse each adjective phrase for case, number, gender, and then identify whether
  the adjective is in attributive position, predicate position, or substantival use.
  Items are drawn from common GNT adjectives and vocabulary introduced through Chapter
  9.
