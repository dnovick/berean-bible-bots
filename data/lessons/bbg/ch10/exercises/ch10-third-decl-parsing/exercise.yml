name: '"Third Declension Parsing Drill" — Exercise'
description: A 20-item parsing drill covering 3rd-declension noun forms drawn from
  common GNT vocabulary. Students identify the case, number, gender, and lexical form
  for each form. Items include consonant-stem nouns (velar, dental, liquid), neuter
  -μα nouns, and i-stem nouns. The definite article is included on most items to aid
  in case identification; some items are anarthrous to increase challenge.
