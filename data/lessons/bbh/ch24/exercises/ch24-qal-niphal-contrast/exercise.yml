name: '"Qal–Niphal Contrast Drill" — Exercise'
description: A 14-root exercise in three parts. Students are given a root with its
  Qal meaning and an attested Niphal form from the OT, then asked to translate the
  Niphal form, name its semantic function (Passive / Reflexive / Simple action), and
  explain in one sentence how the Niphal meaning relates to the Qal. Part A covers
  transitive roots (מָכַר, מָצָא, שָׁמַע, אָסַף, כָּרַת, נָתַן, אָכַל, שָׁמַר); Part
  B covers stative/intransitive roots (נָצַב, יָתַר, שָׁאַר); Part C covers roots
  with no standard Qal (לָחַם, נָחַם, שָׁבַע).
