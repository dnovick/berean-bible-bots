name: '"Peil vs. Ithpeel Stem Identification Drill" — Ch18 Stem Contrast'
description: This exercise presents twenty Aramaic verbal forms drawn from Daniel
  and Ezra representing both the **Peil** (simple passive of the Peal) and the **Ithpeel**
  (reflexive/passive of the Peal) in mixed order. For each form, students identify
  (1) the **stem** (Peil or Ithpeel), (2) the **conjugation** (perfect, imperfect,
  or participle), (3) the full **PGN** (person, gender, number), (4) the **root**
  (three consonants), and (5) the **translation**. Unlike the existing ch18-passive-stems-drill,
  this exercise focuses exclusively on the morphological distinction between the two
  Ch18 stems — the internal-vowel passive (Peil) versus the prefixed reflexive/passive
  (Ithpeel) — helping students internalize the diagnostic cues for each. Weak classes
  covered include I-nun (item 10), I-aleph (item 13), III-he (item 6, 17), III-aleph
  (items 12, 19), hollow (item 5), and guttural R1 (items 9, 18).
