name: '"Weak-Form Identification Drill" — Exercise'
description: A 55-item identification and parsing exercise covering all eight Hophal
  weak classes (I-yod/vav, Biconsonantal/hollow, I-nun, III-he, I-guttural, Geminate,
  III-ח/ע Lamed-Guttural, III-א Lamed-Aleph). Part A (items 1–40) groups forms by
  class — five items per class — so students can build class-by-class recognition
  before mixing. Part B (items 41–55) presents forms from multiple classes in random
  order; students must identify the weak class first, then parse. Answer keys for both
  parts include the diagnostic marker that reveals the weak class.
