name: Subjunctive Parsing — Exercise
description: A 20-item parsing drill on the Greek subjunctive mood. Students parse
  each form (tense / voice / person / number / mood / lexical form), identify the
  use (hortatory, purpose, conditional, prohibition, emphatic denial, indefinite),
  and translate. Items are drawn from GNT-style sentences with the characteristic
  subjunctive constructions. An answer key is embedded in all formats.
