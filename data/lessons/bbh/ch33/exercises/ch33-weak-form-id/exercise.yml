name: '"Weak-Form Identification Drill" — Exercise'
description: 'A 25-item identification and parsing exercise covering four Pual weak
  classes (III-he, I-nun, I-guttural, Geminate). Part A (items 1–15) groups forms
  by class — four to five items per class — so students can build class-by-class recognition
  before mixing. Part B (items 16–25) presents forms from multiple classes in random
  order; students must identify the weak class first, then parse. Answer keys for
  both parts include the diagnostic marker that reveals the weak class. Four discussion
  questions address: the III-he Pual/Piel comparison; the I-nun assimilation contrast
  between Piel (nun retained) and Pual (nun assimilated); compensatory lengthening
  in I-aleph + resh roots; and the Pual-vs-Niphal distinction.'
