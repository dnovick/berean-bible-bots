name: '"Qal Imperative Parsing Drill" — Ch18 Parsing Drill'
description: 'This drill covers all major Qal Imperative forms introduced in BBH Chapter
  18. Students parse 35 forms across three parts: Part A focuses on strong roots (A-class
  and B-class), Part B targets weak-root imperatives across seven root classes (I-י,
  III-ה, Biconsonantal, I-נ, I-aleph), and Part C requires disambiguating Imperative
  from Imperfect and Jussive forms — including negative command constructions with
  אַל.'
