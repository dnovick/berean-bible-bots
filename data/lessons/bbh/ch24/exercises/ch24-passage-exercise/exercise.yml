name: '"Spot the Niphal" — Passage Exercise'
description: A 15-verb parsing exercise drawn from the Joseph narrative (Gen 37–49)
  and the Sinai approach (Exo 19), with 3 distractor verbs (Part C) from the same
  passages. Students first answer "Is it Niphal?" for every highlighted verb before
  parsing conjugation, person-gender-number, root, and semantic function (Passive
  / Reflexive / Simple action). Distractors are Qal forms (קָמָה, מָכְרוּ, יָכֹל)
  drawn from the identical corpus to reinforce Niphal recognition. An answer key is
  embedded in all three formats. Roots are predominantly strong (מָצָא, שָׁבַע, נָצַב,
  אָסַף, מָכַר, שָׁמַע, שָׁמַר) with one middle/stative root (יָתַר).
