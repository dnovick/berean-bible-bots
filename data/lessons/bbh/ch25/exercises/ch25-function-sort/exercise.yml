name: ch25-function-sort
description: '*BBH Chapter 25 · Niphal Weak Verbs*


  A 20-item drill using weak-root Niphal forms exclusively (I-נ, III-ה, hollow, and
  guttural roots). Students classify each form as Passive (P), Reflexive/Reciprocal
  (R), or Simple Action (SA) based on the provided gloss and reference. Several items
  are intentionally ambiguous (e.g., items 1, 3, 16, 18, 20) to train students in
  the Niphal''s inherent semantic flexibility. Roots include: גלה, ראה, עשׂה, בנה,
  נפל, נגש, נגד, נגע, נכה, עלה, כון, שׁים, שׁוב.'
