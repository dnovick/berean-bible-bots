name: δίδωμι Indicative Parsing — Exercise
description: A 20-item parsing drill on the indicative forms of δίδωμι and its compounds
  (especially παραδίδωμι). Students parse each form (tense / voice / person / number
  / mood / lexical form) and translate. Items cover all indicative tenses (present,
  imperfect, aorist, perfect passive). An answer key is embedded in all formats.
