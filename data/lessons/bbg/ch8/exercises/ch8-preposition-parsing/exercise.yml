name: '"Preposition Parsing Drill" — Exercise'
description: A 20-item drill drawn from GNT prepositional phrases. Students identify
  the preposition, the case it governs in each instance, and produce a contextual
  English translation of the phrase. Items cover the major prepositions from Chapter
  8 including multi-case prepositions (διά, κατά, μετά, ἐπί, παρά, περί, ὑπό) where
  the case distinguishes the meaning.
