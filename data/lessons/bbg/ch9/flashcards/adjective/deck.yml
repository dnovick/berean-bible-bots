name: Chapter 9 — ἀγαθός Adjective Paradigm Deck
description: >
  16 cards covering all distinct inflected forms of ἀγαθός, -ή, -όν (good)
  across all three genders (2-1-2 pattern), four cases, and both numbers.
  Front: Greek form. Back: gender, number, case — with all possible parsings
  listed for ambiguous forms.
