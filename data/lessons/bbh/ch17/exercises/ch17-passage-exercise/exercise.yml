name: '"Wayyiqtol and Weqatal in Context" — Ch17 Passage Exercise'
description: 'This passage exercise presents 16 highlighted verb forms drawn from
  four canonical OT passages: Genesis 1:1–5 (creation narrative), Genesis 22:1–4 (Binding
  of Isaac), Deuteronomy 6:4–7 (The Shema), and Exodus 3:1–6 (Moses and the Burning
  Bush). Students identify each form as Wayyiqtol or Weqatal, parse its PGN, identify
  the root, and note its narrative or discourse function (Sequential Past, Sequential
  Future, etc.). The first form in Passage A (בָּרָא, a Qal Perfect) is included deliberately
  to test disambiguation.'
