name: '"Qal Infinitive Construct Parsing Drill" — Ch20 Parsing Exercise'
description: This 25-item parsing drill covers Qal IC forms across all major root
  classes, organized in three parts. Part A presents strong and B-class roots (including
  I-aleph and III-ה) with a preposition, asking students to identify the root, root
  class, preposition, and function. Part B covers III-ה and biconsonantal roots similarly.
  Part C focuses on I-י and I-נ contracted forms plus disambiguation — students must
  distinguish IC from surface-identical Imperative, Imperfect, and Perfect forms using
  morphological and contextual cues.
