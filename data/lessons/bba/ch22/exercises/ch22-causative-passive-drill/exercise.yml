name: 'Exercise: Ch22 Causative and Passive Stems — Capstone Review Drill'
description: 'A **20-item capstone review drill** covering all **nine Aramaic stems**
  introduced across the BBA curriculum (Chapters 12–22). Students identify the stem,
  conjugation, root, PGN, and translation for each verb form drawn from Daniel or
  Ezra. The drill emphasizes the three stems introduced in Chapter 22 (Aphel, Shaphel,
  Hophal) while reviewing all prior stems to consolidate the full verbal system.


  ---'
