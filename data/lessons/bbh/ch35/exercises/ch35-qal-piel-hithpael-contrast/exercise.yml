name: '"Qal / Piel / Hithpael Contrast Drill (Weak Roots)" — Exercise'
description: 'A 15-item triplet drill using five weak roots (גלה, שׁמר, צדק, הלל,
  ענה). Each group presents the Qal, Piel, and Hithpael Perfect 3ms of the same root,
  requiring students to identify the stem, the weak class, how the weakness modifies
  the expected form, and the translation. The exercise covers all four Ch35 weak categories:
  III-ה (Groups 1 and 5), sibilant שׁ metathesis (Group 2), sibilant צ with dental
  assimilation (Group 3), and geminate (Group 4). Four discussion questions probe
  the diagnostic logic, comparative analysis of III-ה Piel forms, and the theological
  significance of key forms (הִצְטַדֵּק, הִתְהַלֵּל).'
