name: '"Peal Perfect Parsing Drill" — Ch13 Peal Perfect'
description: This exercise presents twenty Peal perfect verb forms drawn from the
  Biblical Aramaic corpus (Daniel and Ezra). For each form, students identify the
  three-letter root, give the full PGN (person, gender, number), and translate the
  form. The drill covers all ten persons of the perfect paradigm and includes both
  strong roots and the major weak-root classes introduced in BBA Chapter 13.
