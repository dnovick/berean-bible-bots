name: '"Peal Imperfect Parsing Drill" — Ch14 Peal Imperfect'
description: This exercise presents twenty Peal imperfect verb forms drawn from the
  Biblical Aramaic corpus (Daniel and Ezra) and from the standard strong-verb paradigm.
  For each form, students identify the three-letter root, give the full PGN (person,
  gender, number), and translate the form. The drill covers all ten persons of the
  imperfect paradigm and includes both strong roots and the major weak-root classes
  introduced in BBA Chapter 14.
