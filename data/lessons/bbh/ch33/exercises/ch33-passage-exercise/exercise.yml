name: '"Spot the Pual" — Chapter 33 Passage Exercise'
description: 'Students identify and parse Pual Weak verbs across three passage sets:
  Genesis genealogies (Gen 4:18, 4:26; 46:22) featuring the I-י root ילד, priestly
  legislation (Lev 7:36; Num 3:9) featuring the I-נ root נתן, and instructions/oracles
  (Lev 8:35; Num 22:6; Psa 72:17) featuring the III-ה root צוה and the ברך root with
  R2=ר compensatory lengthening. The exercise presents 15 verbs: 7 Pual targets and
  8 distractors drawn from Qal, Niphal, Piel, Hithpael, and Hophal. Students indicate
  whether each verb is Pual, parse Conjugation/PGN/Root, supply the Stem/Function,
  and identify the weak-root type for each Pual target.'
