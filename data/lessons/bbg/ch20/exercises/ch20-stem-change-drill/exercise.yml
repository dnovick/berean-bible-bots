name: 'Exercise: Stem Change Drill'
description: Twenty verbs drawn from the GNT. For each present form, students identify
  (1) the underlying verbal root, (2) the pattern type (2, 3, or 4), and (3) give
  the future active (or future deponent) form. Verbs are drawn from Pattern 2 (stop-consonant
  changes), Pattern 3 (ablaut/nasal infix), and Pattern 4 (suppletive stems).
