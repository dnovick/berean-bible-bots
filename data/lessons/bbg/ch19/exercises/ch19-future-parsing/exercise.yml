name: 'Exercise: Future Active/Middle Parsing Drill'
description: Twenty future active and middle indicative forms drawn from common GNT
  verbs. Students parse each form (tense, voice, mood, person, number) and provide
  the lexical form and a translation. Forms include regular futures, stop-consonant
  futures (ψ/ξ/σ combinations), liquid futures, and contract verb futures.
