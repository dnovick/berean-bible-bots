name: '"Hithpael Semantic Function Sorting" — Exercise'
description: 'A 25-item classification exercise drawn from Genesis, Exodus, Joshua,
  and Psalms. Students read a Hithpael form with its conjugation, root, reference,
  and contextual gloss, then classify it as one of BBH §34.2''s four semantic
  functions: Intensive-Reflexive (IR), Reciprocal (RC), Iterative (IT), or
  Simple Action (SA). The exercise emphasizes the dominant Intensive-Reflexive
  function while ensuring students encounter all four categories. Four discussion
  questions focus on the most analytically challenging items: the repeated
  Iterative use of הָלַךְ, the exegetically contested הִתְבָּרֲכוּ formula, the
  distinction between Reciprocal and collective/joint action against a third
  party, and the reflexive coloring added by the Hithpael of חָזַק and הָלַל.'
