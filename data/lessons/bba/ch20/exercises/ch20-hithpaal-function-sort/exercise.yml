name: '"Hithpaal Semantic Function Sorting" — Ch20 Function Classification'
description: This exercise presents twenty Hithpaal/Ithpaal verbal forms drawn from
  Daniel and Ezra. Rather than a straightforward parsing drill, students must classify
  the **semantic function** of each Hithpaal form — Reflexive (RF), Reciprocal (RC),
  Iterative/Frequentative (IT), or Estimative/Tolerative (ES) — before parsing fully
  (conjugation, PGN, root) and translating. This classification drill builds the analytical
  skill of reading beyond morphology to recognize the semantic role the Hithpaal plays
  in context. The exercise also reinforces sibilant metathesis (הִשְׁתַּ‑ / יִשְׁתַּ‑)
  across multiple items (1, 2, 7, 12, 17, 18) and covers III-he roots (items 1, 2,
  12, 13, 17, 19), guttural R2 (items 6, 9, 10), and I-nun (item 6).
