name: '"Qal–Hiphil Contrast Drill" — Exercise'
description: A 14-root exercise in three parts. Students are given a root with its
  Qal meaning and an attested Hiphil form from the OT, then asked to translate the
  Hiphil form, name its semantic function (Causative / Declarative / Factitive / Simple
  Action), and explain in one sentence why the Hiphil meaning follows from the Qal.
  Part A covers motion verbs (בּוֹא, יָצָא, שׁוּב, עָלָה, יָרַד, מוּת, יָלַד, שָׁקָה);
  Part B covers stative verbs (כָּבֵד, גָּדַל, רָשָׁע); Part C covers verbs with no
  common Qal (נָכָה, שָׁמַד, נָגַד).
