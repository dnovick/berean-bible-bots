name: '"Spot the Aorist Participle" — Parsing Exercise'
description: A 15-item parsing drill using aorist participle forms drawn from and
  modeled on GNT passages. Students parse each form (tense / voice / case / number
  / gender / lexical form), distinguish 1st from 2nd aorist, identify the use (adverbial,
  adjectival, or substantival), and translate. Items 1–9 are adverbial; items 10–12
  are adjectival; items 13–15 are substantival or passive. An answer key is embedded
  in all formats.
