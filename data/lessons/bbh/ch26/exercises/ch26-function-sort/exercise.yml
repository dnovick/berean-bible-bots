name: '"Semantic Function Sorting" — Exercise'
description: A 27-item classification exercise drawn entirely from Genesis, Exodus,
  Leviticus, Numbers, and Deuteronomy. Students read a Hiphil form with its reference
  and contextual gloss, then classify it as Causative (C), Factitive (F), Declarative
  (D), Simple Action (SA), or Denominative (DN). Roots span all five function types
  and include several ambiguous cases (e.g. זָכַר Hiphil as Causative rather than
  Simple Action) that reward careful reasoning. Four discussion questions connect
  specific items to the broader grammar.
