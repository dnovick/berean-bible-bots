name: Chapter 9 — Hebrew Pronominal Suffix Parsing Drill
description: 'Students see 25 Hebrew forms — nouns, prepositions, and the direct object
  marker with pronominal suffixes — and must identify the base word, isolate the suffix,
  parse the suffix (PGN), and provide a full translation. The exercise builds the
  foundational pattern-recognition skill needed for reading Biblical Hebrew prose:
  strip the suffix, identify the base, read the whole form.'
