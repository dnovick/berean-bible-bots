chapter: 35
course: bbh
title: "Hithpael Weak"
focus: >
  Apply the Hithpael stem to four weak verb classes: Geminate, III-ה, and
  II-Guttural roots with either virtual doubling or compensatory lengthening
  (the guttural or ר in the middle root consonant cannot take dagesh forte).
  Most Geminate and III-ה diagnostics match the strong verb; II-Guttural
  verbs show the most variation. Also covers the Hithpolel stem, used in
  place of Hithpael for certain Biconsonantal and Geminate verbs.

flashcards:
  - morphology
  - vocab

