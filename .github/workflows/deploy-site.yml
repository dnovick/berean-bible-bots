name: Deploy Site to S3

on:
  push:
    branches: [main]
    paths:
      - 'output/reports/**'
      - 'mkdocs.yml'
      - 'overrides/**'
      - 'docs/**'
      - 'data/courses/**'
      - 'data/lessons/**'
      - 'scripts/build_mkdocs.py'
      - 'scripts/build_courses.py'
      - 'scripts/build_lessons.py'
      - 'scripts/validate_courses.py'
      - 'scripts/validate_lessons.py'
      - 'docs_hooks.py'
      - 'notebooks/**'
      - 'notebook-setup/**'
      - '.github/workflows/deploy-site.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install \
            pyyaml \
            mkdocs==1.6.1 \
            mkdocs-material==9.7.6 \
            mkdocstrings==1.0.4 \
            mkdocstrings-python==2.0.3 \
            mkdocs-jupyter==0.25.1

      - name: Validate course content
        run: python scripts/validate_courses.py

      - name: Validate lesson content
        run: python scripts/validate_lessons.py

      - name: Build MkDocs source tree
        run: python scripts/build_mkdocs.py

      - name: Build course pages
        run: python scripts/build_courses.py

      - name: Build MkDocs site
        run: mkdocs build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync MkDocs site to S3
        run: |
          aws s3 sync mkdocs_out/ s3://${{ secrets.S3_BUCKET }}/ \
            --delete \
            --exclude "downloads/*" \
            --exclude "data/*" \
            --cache-control "max-age=300"

      - name: Configure CloudFront custom error pages
        run: |
          DIST_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          RESULT=$(aws cloudfront get-distribution-config --id "$DIST_ID")
          ETAG=$(echo "$RESULT" | jq -r '.ETag')
          NEW_CONFIG=$(echo "$RESULT" | jq '.DistributionConfig |
            .CustomErrorResponses = {
              "Quantity": 2,
              "Items": [
                {
                  "ErrorCode": 404,
                  "ResponsePagePath": "/404.html",
                  "ResponseCode": "404",
                  "ErrorCachingMinTTL": 300
                },
                {
                  "ErrorCode": 403,
                  "ResponsePagePath": "/404.html",
                  "ResponseCode": "404",
                  "ErrorCachingMinTTL": 300
                }
              ]
            }')
          aws cloudfront update-distribution \
            --id "$DIST_ID" \
            --distribution-config "$NEW_CONFIG" \
            --if-match "$ETAG"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
