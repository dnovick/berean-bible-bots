name: Ch4 Syllable Drill — Greek Syllabification Practice
description: A 20-item drill in which students divide Greek words into syllables,
  identify the accent position by name (ultima, penult, or antepenult), and name the
  accent type (acute, grave, or circumflex). Words are drawn from high-frequency NT
  vocabulary. The drill reinforces the three syllabification rules and the accent
  placement rules from Ch4.
