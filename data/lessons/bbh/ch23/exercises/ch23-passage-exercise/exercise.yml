name: '"Reading the Clause" — Ch23 Passage Exercise'
description: 'This 15-item passage exercise draws on five OT passages to practice
  clause analysis in context: the Creation account (Gen 1:1–4), the serpent dialogue
  (Gen 3:1–5), the Shema (Deu 6:4–5), the binding of Isaac (Gen 22:1–2), and a mixed
  set from Jdg 16:20, Gen 4:9, and Exo 20:2. Students identify clause type, any fronted
  element and its rhetorical function, the main verb and its conjugation, and provide
  a full English gloss. Three reflection questions connect clause syntax to narrative
  and theological significance.'
