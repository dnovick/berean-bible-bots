name: '"Peal vs. Pael Contrast Drill" — Ch19 Stem Contrast'
description: This exercise presents twenty Aramaic verbal forms drawn from Daniel
  and Ezra representing both the **Peal** (simple active stem) and the **Pael** (intensive/factitive/causative
  stem) in mixed order. For each form, students identify (1) the **stem** (Peal or
  Pael), (2) the **conjugation** (perfect, imperfect, or participle), (3) the full
  **PGN** (person, gender, number), (4) the **root** (three consonants), and (5) the
  **translation** — with special attention to the meaning difference the Pael introduces
  over the Peal. The diagnostic skill drilled throughout is identifying the **dagesh
  forte in R2** as the Pael marker. Weak classes covered include I-aleph (items 3,
  17), I-nun (item 13), I-yod (item 9), III-he (items 4, 10, 12), III-aleph (item
  7), and guttural R1/R3 (items 5, 11, 19).
