name: '"Weak-Form Identification Drill" — Exercise'
description: A 52-item identification and parsing exercise covering all eight Niphal
  weak classes (III-א, III-ה, III-ח/ע, I-guttural, I-נ, I-י, Biconsonantal, Geminate).
  Part A (items 1–40) groups forms by class — five items per class — so students can
  build class-by-class recognition before mixing. Part B (items 41–52) presents forms
  from multiple classes in random order; students must identify the weak class first,
  then parse. Answer keys for both parts include diagnostic markers. Seven discussion
  questions focus on pairs of forms that could be confused.
