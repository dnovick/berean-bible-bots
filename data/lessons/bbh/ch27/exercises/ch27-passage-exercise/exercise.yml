name: '"Spot the Hiphil" — Passage Exercise'
description: An 18-verb parsing exercise (plus 2 bonus items) drawn from Genesis,
  Exodus, Numbers, and Deuteronomy, with 3 distractor verbs in Part C. Students first
  answer "Is it Hiphil?" for every highlighted verb before parsing conjugation, PGN,
  root, weak class (I-guttural / III-ח/ע / III-א / III-ה / I-נ / I-י / Biconsonantal),
  and providing a causative gloss. Part C distractors (D1=וַיֵּלֶךְ Qal, D2=נוֹלַד
  Niphal, D3=תָּמוּת Qal) are drawn from the same corpus to reinforce Hiphil recognition
  against previously-learned stems. The exercise emphasizes the six most frequent
  weak classes; the bonus items reinforce I-נ and Biconsonantal patterns.
