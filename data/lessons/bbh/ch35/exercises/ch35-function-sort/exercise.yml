name: '"Hithpael Semantic Function Sorting (Weak Roots)" — Exercise'
description: 'A 20-item classification exercise using weak-root Hithpael forms drawn
  from Genesis, Ezra, Jeremiah, Samuel, and other OT books. Students classify each
  form as Reflexive (R), Reciprocal (Re), Intensive/Iterative (I), or Simple Action
  (SA). The exercise emphasizes the dominant Reflexive function (14/20 items) while
  ensuring students encounter the Simple Action category (4 items: פלל and נבא, whose
  Hithpael meanings have lexicalized) and the Intensive category (2 items: רגז, חנן).
  All forms are from weak roots, reinforcing the phonological patterns of Ch35: III-ה
  (גלה, שׁחה, ענה), sibilant metathesis (שׁחה, צדק), geminate (הלל), and I-guttural
  (חנן). Four discussion questions focus on the sibilant-metathesis forms of שׁחה,
  the lexicalization of הִתְפַּלֵּל, the passive-reflexive ambiguity of הִתְנַחֵם,
  and the theological contrast between הִתְבָּרֵךְ and הִצְטַדֵּק.'
