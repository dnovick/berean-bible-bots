name: '"Spot the Hiphil" — Passage Exercise'
description: 'A 21-verb parsing exercise covering all eight Hiphil conjugations drawn
  from three OT passages: the flood narrative (Gen 6–8), the Abrahamic oath (Gen 22:17),
  and the conquest instruction (Deut 7:2). Two bonus verbs from Gen 6:1 and 6:10 are
  included. Three distractor verbs (D1–D3) are woven into the main passages: D1 (נִשְׁחָתָה,
  Niphal, Gen 6:12) appears alongside #1 to contrast Niphal vs. Hiphil; D2 (וּנְתָנָם,
  Qal) and D3 (תִכְרֹת, Qal) are from Deu 7:2 alongside #17–#19.


  Students first answer "Is it Hiphil?" for every highlighted verb before parsing
  conjugation, person-gender-number, root, and semantic function (Causative / Declarative
  / Factitive / Simple action). An answer key is embedded in all three formats.'
