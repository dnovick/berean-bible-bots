name: Ch27 — Biconsonantal / Geminate Disambiguation Drill
description: 'A 24-item drill focused on distinguishing Biconsonantal (II-י/ו) from
  Geminate (R2=R3) roots in Niphal and Hiphil contexts. The two classes are vocally
  identical in all conjugations of both stems — the only reliable distinguisher is
  root knowledge. Each item asks students to identify the stem, parse the conjugation
  and PGN, classify as Biconsonantal or Geminate, give the root, and translate.


  The exercise is organized in three parts:

  - **Part A** (items 1–8): All Niphal — students focus on distinguishing class, not
  stem

  - **Part B** (items 9–16): All Hiphil — same class-discrimination task in the Hiphil
  paradigm

  - **Part C** (items 17–24): Mixed — stem and class both unknown; includes Qal and
  Hophal distractors


  ---'
