name: '"Pronominal Suffixes on Verbs in Context" — Ch19 Passage Exercise'
description: 'This passage exercise presents 14 highlighted verb+suffix forms drawn
  from five canonical passages: Genesis 28:15 (God''s promise to Jacob at Bethel),
  Genesis 45:4–8 (Joseph''s theological reframing), Psalm 23:1–4 (the LORD my shepherd),
  Genesis 39:19–20 (Potiphar and the Inf.Const. temporal clauses), and Psalm 16:1
  + Deuteronomy 31:6 (imperative and imperfect + suffix). Students identify the base
  conjugation and root, parse the suffix PGN, determine whether the suffix is a direct
  object (on finite verbs) or subject (on Infinitive Construct), and provide the full
  gloss.'
