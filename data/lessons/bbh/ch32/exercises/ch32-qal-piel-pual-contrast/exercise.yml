name: ch32-qal-piel-pual-contrast
description: 'A 15-item triplet drill showing the same root in Qal, Piel, and Pual
  side by side. Students identify the stem and translate each form. The side-by-side
  format highlights the systematic R1 vowel shift: variable (Qal) → hiriq/tsere (Piel)
  → qibbuts/holem (Pual), with dagesh forte in R2 for both Piel and Pual.


  Roots covered: ברך, שׁלח, דבר, כבד, ספר.'
