name: '"Wayyiqtol and Weqatal Parsing Drill" — Ch17 Parsing Drill'
description: 'This drill covers all major Wayyiqtol and Weqatal patterns introduced
  in BBH Chapter 17. Students parse 30 forms across three parts: Part A focuses on
  strong and common weak Wayyiqtol forms, Part B targets weak-root Wayyiqtol forms
  (III-ה, Biconsonantal, Geminate, I-י, I-נ), and Part C requires disambiguating Weqatal
  from Perfect and Imperfect forms using the presence and type of waw prefix.'
