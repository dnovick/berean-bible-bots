name: '"Piel–Pual Contrast Drill" — Exercise'
description: A 25-item active/passive contrast and identification exercise introducing
  the Pual stem. Part A (items 1–10) presents five root pairs — each pair gives one
  Piel active form and its Pual passive counterpart, drawn from the same passage where
  possible. Students identify the stem, parse, and translate both forms, experiencing
  the active-passive relationship directly. Part B (items 11–25) is a 15-item mixed
  drill covering Piel, Pual, Hiphil, and Hophal; students identify the stem before
  parsing. Answer keys include notes on compensatory lengthening (ר rejects dagesh)
  and Hophal-vs-Pual disambiguation. Four discussion questions address the R1-vowel
  diagnostic, the compensatory lengthening rule, Hophal/Pual confusion points, and
  the theology of the Pual in the Genesis genealogies.
