name: '"Peal Perfect vs. Peal Imperfect Contrast Drill" — Ch13 Conjugation Contrast'
description: This exercise presents twenty Aramaic verbal forms drawn from Daniel
  and Ezra representing both the **Peal Perfect** and the **Peal Imperfect** in mixed
  order. For each form, students identify (1) the **conjugation** (Perfect or Imperfect),
  (2) the full **PGN** (person, gender, number), (3) the **root** (three consonants),
  and (4) the **translation**. The drill is designed as a contrast exercise so that
  students learn from the very start of the Peal verbal system how to distinguish
  the Perfect from the Imperfect — a distinction that becomes critical when reading
  Daniel or Ezra. Although Ch13 introduces only the Perfect, this preview of Imperfect
  forms equips students with the key diagnostic patterns before Ch14.
