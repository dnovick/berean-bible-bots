name: '"Qal Participle Parsing Drill" — Ch22 Parsing Exercise'
description: This 32-item parsing drill covers Qal active and passive participle forms
  across all major root classes in four parts. Part A presents strong-root active
  participles in all four inflected forms (ms, fs, mp, construct). Part B covers weak-root
  active participles (III-ה, Biconsonantal, I-י, I-נ, I-aleph). Part C introduces
  the passive participle (qatûl pattern) in all attested forms. Part D requires discrimination
  among active participle, passive participle, Perfect, Imperfect, IC, and IA — using
  vowel patterns (holem-waw/tsere vs. qamets/shureq) and context clues.
