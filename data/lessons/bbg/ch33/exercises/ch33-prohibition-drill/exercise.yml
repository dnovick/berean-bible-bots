name: Prohibition Pattern Drill
description: 'A 20-item pattern drill presenting prohibition sentences drawn from
  or modeled on GNT passages. Students classify each prohibition as STOP (μή + present
  imperative = stop an ongoing action) or DONT (μή + aorist subjunctive = do not begin),
  parse tense and mood of the verbal form, supply the lexical form, and translate.
  The exercise includes exactly 10 of each pattern and includes a μι-verb (δίδωμι,
  #19) and two φοβέομαι items (#2, #11) that directly contrast the two patterns with
  the same lexical verb. Discussion questions probe the limits of the STOP/DONT rule,
  μι-verb imperative morphology, and pragmatic differences between the two prohibition
  strategies. An answer key is embedded in all three formats.'
