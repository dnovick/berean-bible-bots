name: '"Qal / Piel / Hithpael Contrast Drill (Strong Roots)" — Exercise'
description: 'A 15-item triplet drill using five strong roots (קדשׁ, כבד, שׁמר, פלל,
  ברך). Each group presents the Qal, Piel, and Hithpael Perfect 3ms of the same root.
  Students identify the stem, describe its semantic function, and translate. The exercise
  builds recognition of the three-way contrast that defines Ch34: basic/stative action
  (Qal) vs. factitive/intensive (Piel) vs. reflexive (Hithpael). Group 3 (שׁמר) introduces
  sibilant metathesis (הִתְ + שׁ → הִשְׁתְּ), and Group 4 (פלל) highlights the Hithpael''s
  denominative/reflexive force in the OT word for prayer.'
