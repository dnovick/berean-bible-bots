name: '"Peil and Ithpeel Stem Drill" — Ch18 Passive Stems'
description: This exercise presents twenty verb forms drawn from Daniel and Ezra representing
  both the **Peil** (simple passive of the Peal) and the **Hithpeel/Ithpeel** (reflexive/passive
  of the Peal). For each form, students identify (1) the **stem** (Peil or Ithpeel),
  (2) the **conjugation** (perfect, imperfect, or participle), (3) the **root** (three
  consonants, Peal perfect 3ms form), and (4) the **translation**. The drill covers
  the defining morphological features of each stem, including metathesis with sibilant-initial
  roots (items 5, 9, 11, 20), guttural variation (item 8), and III-he root behavior
  (items 1, 7, 9, 10, 17).
