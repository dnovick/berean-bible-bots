name: '"Qal Infinitive Construct in Context" — Ch20 Passage Exercise'
description: 'This passage exercise presents 15 highlighted IC forms drawn from nine
  OT passages spanning Genesis, Exodus, Deuteronomy, Ecclesiastes, and Psalms. Passages
  were selected to represent the full range of IC functions: the quotative formula
  לֵאמֹר (Gen 2:16), לְ-purpose clauses (Gen 11:5; 19:22; 37:18; 45:4–5), כְּ-temporal
  clauses (Gen 39:18–19), לְ-epexegetical after עֵת (Ecc 3:1–2), and the I-י IC form
  in a temporal-epexegetical context (Exo 19:1). Two Hiphil IC forms (Exo 3:8) are
  included to introduce the Hiphil IC pattern alongside Qal. Students identify root,
  root class, preposition, and function for each form.'
