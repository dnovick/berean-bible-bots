name: ch32-function-sort
description: 'A 20-item exercise reinforcing the core semantic relationship between
  the Piel and Pual stems: the Pual is always the passive of the Piel. For each Pual
  form, students supply (1) the Piel active meaning and (2) the Pual passive translation.


  Forms cover all three Pual conjugations encountered at this stage: perfect (3ms,
  3cp), imperfect (3ms), and participle (ms). Roots include both standard qibbuts-type
  forms and guttural-R2 forms where holem appears instead (e.g., בֹּרַךְ, גֹּרַשׁ).'
