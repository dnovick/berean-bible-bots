name: '"Pronominal Suffixes on Verbs Parsing Drill" — Ch19 Parsing Drill'
description: 'This drill covers all major pronominal suffix constructions on verbs
  introduced in BBH Chapter 19. Students parse 25 forms across four parts: Part A
  (Perfect + suffix), Part B (Imperfect + suffix, including energic nun identification),
  Part C (Imperative and Wayyiqtol + suffix), and Part D (Infinitive Construct + suffix,
  where the critical distinction is that the suffix marks the subject, not the object
  of the action).'
