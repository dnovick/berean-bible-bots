name: '"Qal Infinitive Absolute Parsing Drill" — Ch21 Parsing Exercise'
description: 'This 25-item parsing drill covers Qal IA forms across all major root
  classes in three parts. Part A presents emphatic pairs (IA + finite verb of same
  root): students identify the IA, name the root and class, and state the function.
  Part B presents standalone IA forms (imperatival and manner/progressive uses) without
  a paired finite verb. Part C requires discrimination among IA, IC, Imperative, Imperfect,
  and Perfect — using vowel patterns (qamets vs. shewa under R1, holem-waw vs. patach)
  and context clues (presence/absence of preposition, paired verb) to identify each
  form.'
