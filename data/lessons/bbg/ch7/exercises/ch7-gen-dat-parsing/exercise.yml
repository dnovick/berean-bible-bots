name: '"Genitive and Dative Parsing Drill" — Exercise'
description: A 20-item parsing drill covering 2nd-declension masculine and neuter
  noun forms drawn from the GNT vocabulary. Students identify the case, number, gender,
  lexical form, and a brief translation note for each form. Items include both articulate
  (with the definite article) and anarthrous forms, and cover genitive singular, genitive
  plural, dative singular, and dative plural across masculine and neuter nouns.
