name: '"Weak-Form Identification Drill" — Exercise'
description: A 50-item identification and parsing exercise covering all eight Hiphil
  weak classes (I-guttural, III-ח/ע, III-א, III-ה, I-נ, I-י, Biconsonantal, Geminate).
  Part A (items 1–40) groups forms by class — five items per class — so students can
  build class-by-class recognition before mixing. Part B (items 41–50) presents forms
  from multiple classes in random order; students must identify the weak class first,
  then parse. Answer keys for both parts include the diagnostic marker that reveals
  the weak class. Five discussion questions focus on pairs of forms that could be
  confused.
