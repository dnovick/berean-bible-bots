name: '"Sounding Out Proper Names" — Vowel Identification in Proper Names'
description: 15-item drill using familiar biblical proper names (Sarah, Noah, David,
  Ruth, Leah, Moses, Jacob, Isaac, Aaron, Miriam, Solomon, Elijah, Joseph, Abraham,
  Jerusalem). Students identify all vowel signs in left-to-right order by BBH name
  and determine whether any matres lectionis (waw, yod, or he) are present.
