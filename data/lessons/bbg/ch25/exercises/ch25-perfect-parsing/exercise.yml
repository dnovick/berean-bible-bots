name: 'Exercise: Perfect Indicative Parsing Drill'
description: Twenty perfect indicative forms from GNT vocabulary. Students parse each
  form (tense, voice, mood, person, number), identify the reduplication type, provide
  the lexical form, and explain the combinative aspect in their translation. Selected
  items include second perfects (no κ), perfect middle/passive forms, and aorist distractors
  that look similar.
