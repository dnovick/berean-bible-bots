name: Adjectival Participle Parsing — Exercise
description: A 15-item parsing drill focused on adjectival (attributive) and substantival
  uses of the participle. Students parse each form, identify the use (attributive
  vs. substantival), note whether the participle is adjectival or substantival, and
  translate. Items use GNT-style phrases covering all case/gender/number combinations
  and multiple tenses. An answer key is embedded in all formats.
