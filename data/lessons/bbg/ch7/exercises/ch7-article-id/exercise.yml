name: BBG Chapter 7 — Definite Article Identification Exercise
description: '20-item exercise drawn from GNT passages. Each item shows an article
  form in its verse context. Students identify the case, number, and gender of the
  article.


  Covers all five cases (Nom, Gen, Dat, Acc, Nom./Acc.) and all three genders (Masculine,
  Feminine, Neuter) across singular and plural forms.


  ---'
