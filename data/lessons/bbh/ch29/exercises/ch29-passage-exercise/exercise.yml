name: '"Spot the Hophal Weak" — Chapter 29 Passage Exercise'
description: 'Students identify and parse Hophal weak-root verbs across three passages:
  the Joseph narrative (Genesis 39–43, featuring I-י roots בוא and ירד and biconsonantal
  שוב), the tabernacle texts (Exodus 40:17 and Numbers 9:15–17, featuring biconsonantal
  קום), and a mixed passage from Genesis 38 and 43 plus Exodus 14 (I-י root יצא and
  I-נ root נגד). The exercise presents 14 numbered verbs: 10 Hophal weak targets (including
  Perfects, Imperfects, and Participles) plus 4 distractors from Qal weak and Hiphil
  weak. Students indicate whether each verb is Hophal, then parse Conjugation/PGN/Root
  and supply the Stem/Function with the corresponding Hiphil meaning.'
