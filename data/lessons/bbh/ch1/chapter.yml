chapter: 1
course: bbh
title: "Hebrew Alphabet"
focus: >
  Memorize all 23 Hebrew consonants (including Sin and Shin as distinct letters),
  their names, and pronunciations. Learn the 5 final forms, the 6 begadkephat
  letters with their hard and soft pronunciations (Daghesh Lene), and the 4
  guttural consonants (Alef, He, Ḥet, Ayin).

flashcards:
  - alphabet

exercises:
  - ch1-letter-recognition
  - ch1-confusable-pairs
  - ch1-sofit-forms
  - ch1-begadkephat
