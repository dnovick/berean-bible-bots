name: '"Spot the Hithpael" — Chapter 35 Passage Exercise'
description: 'Students identify and parse Hithpael weak-root verbs across passages
  from Genesis 22, Genesis 18, Exodus 20, Psalm 95, Genesis 35, 1 Samuel 10, Genesis
  44, and 2 Kings 8. The exercise presents 10 numbered verbs: 7 Hithpael targets (weak
  roots) and 3 distractors from Qal, Niphal, and Hophal. The dominant root is שׁחה
  (III-ה, I-שׁ) appearing in three conjugations (cohortative, wayyiqtol, imperfect),
  requiring students to track both the I-שׁ metathesis and the III-ה endings across
  forms. One I-צ metathesis example (נִצְטַדָּק, Gen 44:16) and two I-נ examples (הִתְנַבִּיתָ
  and וַיִּתְנַבְּאוּ) round out the weak-root coverage.'
