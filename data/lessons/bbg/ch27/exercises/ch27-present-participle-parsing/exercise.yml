name: '"Spot the Present Participle" — Parsing Exercise'
description: A 15-item parsing drill using present participle forms drawn from and
  modeled on GNT passages. Students parse each form (tense / voice / case / number
  / gender / lexical form), identify the use (adverbial, adjectival, or substantival),
  and provide a translation. Items 1–10 are clear adverbial or adjectival uses; items
  11–15 include substantival participles and the participle of εἰμί. An answer key
  is embedded in all three formats.
