name: Ch7 Preposition Drill — Exercise README
description: A 20-item drill covering conjunctions and prepositions from BBA Chapter
  7 (*Basics of Biblical Aramaic*, Van Pelt). Each item presents an Aramaic phrase
  from Daniel or Ezra; the student identifies the preposition or conjunction, gives
  its gloss, identifies the state of the following noun, and translates the phrase.
