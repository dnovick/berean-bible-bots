name: '"Personal Pronoun Parsing Drill" — Exercise'
description: A 20-item parsing drill covering 1st and 2nd person pronoun forms. Students
  identify the person (1st/2nd), case (Nom/Gen/Dat/Acc), number (Sg/Pl), and provide
  an English translation of the form. Items include both emphatic (accented) and unemphatic
  (enclitic) forms, and cover all four cases in both singular and plural for each
  person.
