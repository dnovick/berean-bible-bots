name: Ch29 Hophal Weak Paradigm Drill
description: 'Multiple-choice paradigm drill covering all 8 Hophal weak-root classes.
  For each row, students select the correct Hophal form from a dropdown with plausible
  distractors drawn from Qal, Hiphil, Niphal, Piel, and other Hophal conjugations
  of the same root.


  Classes covered: I-י/ו (ילד), Biconsonantal (קום), I-guttural (עמד), I-נ (נגד),
  III-ה (גלה), III-ח/ע (שׁלח), III-א (מצא), Geminate (נקם).


  Key contrasts drilled: Shureq vs. Qibbuts prefix; Seghol Perfect vs. Qibbuts
  Imperfect for I-guttural; apocopated Wayyiqtol for III-ה; Dagesh forte in R2
  for I-נ and Geminate.'
