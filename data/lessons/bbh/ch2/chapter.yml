chapter: 2
course: bbh
title: "Hebrew Vowels"
focus: >
  Learn the Hebrew vowel system as introduced by the Masoretes: long vowels
  (Qamets, Tsere, Holem), short vowels (Pathach, Seghol, Hireq, Qamets Hatuf,
  Qibbuts), and reduced vowels (Hateph Pathach, Hateph Seghol, Hateph Qamets).
  Learn the vowel letters written with He, Waw, and Yod; defective writing;
  Shewa; and the Daghesh Forte.

flashcards:
