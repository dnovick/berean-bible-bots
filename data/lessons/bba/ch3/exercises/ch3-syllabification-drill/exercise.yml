name: '"Aramaic Syllabification Drill" — Syllable Division Exercise'
description: 20-item drill covering syllable division, syllable type identification
  (open/closed), vowel class, and stress placement for common Aramaic words. Students
  divide each word into syllables, label each syllable type, identify the stressed
  syllable, and note any special features (quiescent letters, compensatory lengthening,
  Dagesh Forte).
