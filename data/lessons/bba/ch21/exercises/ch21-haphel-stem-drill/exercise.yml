name: 'Exercise: Ch21 Haphel Stem Drill'
description: 'A 20-item parsing drill covering the **Haphel** stem (H stem — causative)
  using verbs from Daniel and Ezra. Students identify conjugation, root, PGN, and
  translation for each Haphel form. Includes strong roots, I-yod roots (ידע), hollow
  roots (קום), and the idiomatic "bring" root (יתי/אתה).


  ---'
