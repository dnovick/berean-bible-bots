name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # pandas/pyarrow/matplotlib/seaborn: importing ANY bible_grammar submodule executes
        # src/bible_grammar/__init__.py first (Python initializes parent packages before
        # children) — that top-level __init__ imports reporting/charts.py at module level,
        # which needs matplotlib+seaborn even for tests that never touch charting directly.
        # Verified empirically against a from-scratch venv, not assumed.
        # matplotlib<3.11: matches requirements.txt's pin — 3.11 removes plt.get_cmap(),
        # which verb_forms.py/morph_chart.py still call; an unpinned install here made mypy
        # fail on code that was never actually broken locally (matplotlib wasn't previously
        # installed in CI at all, so mypy --ignore-missing-imports silently skipped it).
        run: pip install pyyaml PyJWT cryptography requests flake8 mypy beautifulsoup4 pandas pyarrow "matplotlib<3.11" seaborn pytest pytest-cov

      - name: Build generated reports content
        # validate_links.py also scans mkdocs_src/reports/ — gitignored/generated
        # from output/reports/ via build_mkdocs.py's build_reports(). Deliberately
        # calling build_reports() directly rather than build_mkdocs.py's main():
        # main() also clears mkdocs_nav.yml's generated Courses section, which is
        # then only correctly refilled if build_courses.py runs right after it —
        # order-dependent, and it also unconditionally wipes the HAND-MAINTAINED
        # "Standards & Policies" nav section, which no build script knows how to
        # regenerate. build_reports() alone only writes mkdocs_src/reports/ and
        # never touches mkdocs_nav.yml at all — verified in an isolated git
        # worktree (not this repo's real working tree) that it fixes the target
        # validate_links warning with zero side effects on nav.yml.
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from build_mkdocs import build_reports
          build_reports()
          "

      - name: Build generated studies content
        # validate_links.py scans mkdocs_src/studies/ (among other roots) for broken
        # links. Psalm 119's memorization section pages are deliberately gitignored
        # (mkdocs_src/studies/psalm-119/memorization/[0-9]*/, see .gitignore) and
        # regenerated by build_studies.py — deploy-site.yml already does this before
        # building the site, but this workflow never did, so validate_links --strict
        # was failing on a fresh checkout independent of whatever a PR actually
        # changes. PDF generation gracefully no-ops without reportlab (not installed
        # here) — validate_links only checks .md files, so that's fine.
        run: python scripts/build_studies.py

      - name: Run content validators and lint
        id: checks
        run: |
          FAILED=0
          BODY=""

          if ! python -m flake8 src/ > /tmp/flake8.txt 2>&1; then
            FAILED=1
            BODY="${BODY}
          ### flake8
          $(cat /tmp/flake8.txt)"
          fi

          if ! python -m mypy src/ --ignore-missing-imports --no-error-summary --no-warn-unused-ignores > /tmp/mypy.txt 2>&1; then
            FAILED=1
            BODY="${BODY}
          ### mypy
          $(cat /tmp/mypy.txt)"
          fi

          # Fast unit tests only (-m "not integration"): integration/behavioral tests need
          # data/processed/*.parquet, which this workflow doesn't build — they still require
          # a manual `pytest` run locally. See docs/policies/capability-development.md.
          # check_coverage.py runs this same pytest invocation and additionally enforces
          # the "coverage must not decrease" ratchet against coverage-baseline.json's
          # unit_min_percent — see docs/policies/test-coverage.md.
          if ! python scripts/check_coverage.py > /tmp/pytest.txt 2>&1; then
            FAILED=1
            BODY="${BODY}
          ### pytest (unit) / coverage
          $(tail -40 /tmp/pytest.txt)"
          fi

          if ! python scripts/validate_courses.py > /tmp/courses.txt 2>&1; then
            FAILED=1
            BODY="${BODY}
          ### validate_courses
          $(cat /tmp/courses.txt)"
          fi

          if ! python scripts/validate_lessons.py > /tmp/lessons.txt 2>&1; then
            FAILED=1
            BODY="${BODY}
          ### validate_lessons
          $(cat /tmp/lessons.txt)"
          fi

          # validate_exercises: errors fail, warnings are informational
          if ! python scripts/validate_exercises.py > /tmp/exercises.txt 2>&1; then
            FAILED=1
            BODY="${BODY}
          ### validate_exercises
          $(cat /tmp/exercises.txt)"
          fi

          # validate_nav: all missing nav refs are errors
          if ! python scripts/validate_nav.py > /tmp/nav.txt 2>&1; then
            FAILED=1
            BODY="${BODY}
          ### validate_nav
          $(cat /tmp/nav.txt)"
          fi

          # validate_links: --strict; zero broken links required to pass
          if ! python scripts/validate_links.py --strict > /tmp/links.txt 2>&1; then
            FAILED=1
            LINKS_WARNS=$(grep -c "^WARN" /tmp/links.txt || true)
            BODY="${BODY}
          ### validate_links FAILED — ${LINKS_WARNS} broken link(s)
          $(tail -5 /tmp/links.txt)"
          fi

          # validate_tables: warnings only (non-blocking); use --strict locally to fail
          python scripts/validate_tables.py > /tmp/tables.txt 2>&1 || true
          TABLES_WARNS=$(grep -c "^WARN" /tmp/tables.txt || true)
          if [ "${TABLES_WARNS}" -gt 0 ]; then
            BODY="${BODY}
          ### validate_tables (informational — ${TABLES_WARNS} bold-summary-row warning(s))
          $(cat /tmp/tables.txt)"
          fi

          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          {
            echo "body<<REVIEW_BODY_EOF"
            echo "${BODY}"
            echo "REVIEW_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate reviewer token
        id: reviewer-token
        env:
          REVIEWER_APP_ID: ${{ secrets.REVIEWER_01_APP_ID }}
          REVIEWER_PRIVATE_KEY: ${{ secrets.REVIEWER_01_PRIVATE_KEY }}
          REVIEWER_INSTALLATION_ID: ${{ secrets.REVIEWER_01_INSTALLATION_ID }}
        run: |
          printf '%s' "$REVIEWER_PRIVATE_KEY" > /tmp/reviewer.pem
          TOKEN=$(REVIEWER_PRIVATE_KEY_PATH=/tmp/reviewer.pem \
            python scripts/github_app_token.py --role reviewer)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          rm -f /tmp/reviewer.pem

      - name: Approve PR
        if: steps.checks.outputs.failed == '0'
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} \
            --approve \
            --body "All automated checks passed: flake8, mypy, pytest (unit) + coverage ratchet, validate_courses, validate_lessons, validate_exercises, validate_nav, validate_tables."

      - name: Request changes
        if: steps.checks.outputs.failed != '0'
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token }}
          REVIEW_BODY: ${{ steps.checks.outputs.body }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} \
            --request-changes \
            --body "Automated checks failed. Fix the issues below and push a new commit.${REVIEW_BODY}"

      # Runs last, after the review comment above is already posted, so that always
      # happens regardless of outcome. Until this step existed, "failed=1" only ever
      # affected which review comment got posted (informational, per CLAUDE.md) — the
      # job itself always exited 0, so the required `review` status check was green
      # unconditionally, no matter what flake8/mypy/pytest/validate_* actually found.
      - name: Fail the job if any check failed
        if: always() && steps.checks.outputs.failed != '0'
        run: |
          echo "One or more checks failed — see the posted PR review for details."
          exit 1
