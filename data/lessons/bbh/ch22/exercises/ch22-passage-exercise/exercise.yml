name: '"Qal Participle in Context" — Ch22 Passage Exercise'
description: 'This passage exercise presents 15 highlighted participle forms drawn
  from eleven OT passages spanning Genesis, Exodus, Leviticus, Numbers, and Deuteronomy.
  Passages were selected to illustrate the full range of participle functions: predicate
  passive participles in the blessing and curse formulas (Gen 3:14, 4:11, 14:19, 24:27),
  predicate and circumstantial active participles (Gen 18:1, Exo 3:2, Num 14:14),
  the substantive participle used as a title (Gen 4:9, Lev 25:25), occupational/progressive
  active participles (Gen 37:2, Num 27:17), and attributive passive participles (Exo
  6:6, Deu 9:10, Lev 2:4–5). Students identify active/passive, root, root class, gender/number,
  syntactic function, and gloss for each highlighted form.'
