name: Participle Use Classification Drill
description: A 20-item classification drill presenting participial phrases drawn from
  and modeled on GNT usage. Students classify each participle as ADV (adverbial/circumstantial),
  ADJ (adjectival/attributive), or SUB (substantival), identify the key formal signal
  (presence/absence of article, anaphoric article pattern, no antecedent noun), and
  translate. Items include both present and aorist participles. Discussion questions
  probe the boundary between adjectival and substantival uses and the temporal force
  of aorist vs. present adverbial participles. An answer key is embedded in all three
  formats.
