name: '"Clause Analysis Drill" — Ch23 Exercise'
description: 'This 20-item drill covers all five clause types taught in BBH Chapter
  23: Verbal VSO, Verbal with fronted element, Verbless, Waw-disjunctive, and mixed.
  Students identify clause type, main verb and conjugation, fronted element and its
  rhetorical function, and provide a full English gloss. Items are drawn from Genesis,
  Exodus, Deuteronomy, Psalms, and Judges, emphasizing high-frequency clauses from
  Torah narrative and poetry.'
