name: '"Spot the Hophal" — Chapter 28 Passage Exercise'
description: 'Students identify and parse Hophal (passive causative) verbs across
  eight passages: Gen 22:20, Gen 39:1, Gen 42:28, Gen 43:18, Exo 5:14–16, Exo 10:8,
  Exo 40:17–18, and Num 35:16–18, 30–31. The exercise contains 12 Hophal verbs and
  8 distractors (4 Qal, 2 Niphal, 2 Hiphil). Students identify the stem, parse Conjugation/PGN/Root,
  and supply a brief English gloss. Clicking ▶ Answer reveals the column-aligned parse
  and the KJV translation for that verse.'
