name: '"Qamets or Qamets Hatuf?" — Vowel Disambiguation Drill'
description: 12-item drill on distinguishing Qamets (long A) from Qamets Hatuf
  (short O). Both share the same T-bar symbol; students analyze syllable type
  (open/closed), accent, and metheg presence to determine which vowel is intended.
  Items alternate evenly between Qamets and Qamets Hatuf answers.
