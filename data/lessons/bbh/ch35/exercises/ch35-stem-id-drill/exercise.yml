name: '"Stem Identification Drill (Weak Roots)" — Exercise'
description: 'A 24-item drill covering all major conjugations of three weak roots
  (גלה, הלל, ענה) across three stems: Qal, Piel, and Hithpael. Items are grouped by
  conjugation (perfect, imperfect, wayyiqtol, imperative, participle) to highlight
  how III-ה endings change across conjugations. Key diagnostic challenges: (1) Piel
  הִלֵּל begins with הִ– (looks like a Hiphil/Hithpael prefix) but lacks ת — identifying
  R1 (ה) vs. a prefix is essential; (2) all three stems apocopate the final ה in wayyiqtol,
  forcing students to use the prefix vowel pattern alone; (3) the Hithpael imperative
  (הִתְגַּלֵּה) and Qal imperative (גְּלֵה) differ only by the הִתְ prefix. Eight
  items per stem; all 24 items use root גלה except items 4–6 (הלל) and 7–9 (ענה).'
