name: Ch6 Nom/Acc Parsing Drill — 2nd Declension Nouns and Article
description: A 20-item parsing drill covering 2nd-declension masculine and neuter
  nouns and the definite article. Students identify case, number, gender, lexical
  form, and syntactic function (subject, direct object, predicate nominative, or article
  modifying a noun). All forms are drawn from the nominative and accusative cases
  as introduced in Ch6.
