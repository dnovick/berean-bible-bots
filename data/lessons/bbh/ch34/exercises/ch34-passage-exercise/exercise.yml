name: '"Spot the Hithpael" — Chapter 34 Passage Exercise'
description: 'Students identify and parse Hithpael Strong verbs across passages from
  1 Kings 8, Genesis 20, Joshua 3, Exodus 19, Genesis 22, and 2 Samuel 10. The exercise
  presents 11 verbs: 8 Hithpael targets (strong roots only) and 3 distractors drawn
  from Piel, Pual, and Hiphil — the stems most easily confused with Hithpael. The
  Pual distractor (קֻדַּשׁ, same root as two Hithpael targets) is the critical discrimination
  challenge: students must identify that Qibbuts under R1 = Pual passive, while הִתְ-
  prefix = Hithpael reflexive. The focus verb throughout Passage A is הִתְפַּלֵּל
  (to pray), a denominative Hithpael with no Qal equivalent.'
