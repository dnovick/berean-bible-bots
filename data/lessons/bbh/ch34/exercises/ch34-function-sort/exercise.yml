name: '"Hithpael Semantic Function Sorting" — Exercise'
description: 'A 25-item classification exercise drawn from Genesis, Exodus, Joshua,
  and Psalms. Students read a Hithpael form with its conjugation, root, reference,
  and contextual gloss, then classify it as Reflexive (R), Reciprocal (RC), Iterative
  (IT), Estimative (ES), or Denominative (DN). The exercise emphasizes the dominant
  Reflexive function while ensuring students encounter all five categories, including
  the rarer Estimative and Denominative classes. Four discussion questions focus on
  the most analytically challenging items: the repeated Iterative use of הָלַךְ, the
  exegetically contested הִתְבָּרֲכוּ formula, the distinction between Reciprocal
  and Collective plotting, and the pragmatic force of the Estimative Hithpael.'
