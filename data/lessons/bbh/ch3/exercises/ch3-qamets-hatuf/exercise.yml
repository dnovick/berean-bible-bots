name: "Ch3 Qamets vs. Qamets Hatuf"
description: >
  Distinguish Qamets (long a) from Qamets Hatuf (short o) — two vowels that
  look identical — across 10 items drawn from real BBH Chapter 3 vocabulary
  and illustrative syllable contexts, applying the closed-and-unaccented
  rule and the Metheg override.
