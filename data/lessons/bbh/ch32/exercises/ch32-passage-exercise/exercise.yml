name: '"Spot the Pual" — Chapter 32 Passage Exercise'
description: 'Students identify and parse Pual Strong verbs across three Torah/Prophets
  passages: Numbers 22:6, 12; 23:8, 20 (the Balaam cycle, richest Pual concentration
  in Torah for ברך), Exodus 29:36–37 (consecration of the altar), and Exodus 14:4
  / Isaiah 43:23 (Pual of כבד). The exercise presents 15 verbs: 3 Pual targets and
  12 distractors drawn from Qal, Niphal, Piel, and Hophal. Students indicate whether
  each verb is Pual, then parse Conjugation/PGN/Root and supply the Stem/Function.
  A key diagnostic skill is distinguishing Pual (Qibbuts under R1 + Dagesh in R2)
  from the visually similar Piel (Hireq/i-class under R1) and Hophal (u-class on the
  prefix consonant, not R1).'
