name: Imperative Parsing — Exercise
description: A 20-item parsing drill on the Greek imperative. Students parse each
  form (tense / voice / person / number / mood / lexical form), note aspect implications,
  and translate. Items cover present and aorist imperatives (active, middle/passive),
  2nd and 3rd person forms, prohibitions, and the imperative of εἰμί. An answer key
  is embedded in all formats.
