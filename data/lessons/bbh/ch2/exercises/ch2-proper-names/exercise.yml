name: '"Sounding Out Proper Names" — Vowel Letter Identification in Proper Names'
description: 15-item drill using familiar biblical proper names (Sarah, Noah, David,
  Ruth, Leah, Moses, Jacob, Isaac, Aaron, Miriam, Solomon, Elijah, Joseph, Abraham,
  Jerusalem). Students write the English name for each Hebrew proper name and determine
  whether any matres lectionis (waw, yod, or he) are present.
