name: '"Vowel Letter Identification" — Matres Lectionis Drill'
description: 15-item drill on recognizing matres lectionis (vowel letters) in common
  Hebrew vocabulary. Students identify whether waw (ו), yod (י), or he (ה) is
  functioning as a vowel holder, and name the vowel it represents (Holem Waw,
  Hireq Yod, Tsere Yod, Qamets He, Seghol He, Shureq).
