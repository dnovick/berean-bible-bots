name: Chapter 30 — Qal–Piel Contrast Drill
description: 'A 17-item Qal-to-Piel contrast exercise organized in three parts: Part
  A (7 items) covers Intensive roots where the Piel performs the Qal action more forcefully
  or completely; Part B (5 items) covers Factitive roots where the Piel causes an
  object to enter the stative state described by the Qal; Part C (5 items) covers
  Simple Action and Denominative roots where the intensification model
  breaks down. All forms are drawn from attested OT texts (Genesis 1–43, Exodus 19,
  32, Leviticus 4 and 21). Students translate each Piel, name the function, and check
  their answer; three discussion questions press on the Intensive-vs.-Factitive distinction,
  the grammatical object that Factitive verbs require, and why the three non-Intensive
  categories cannot be explained by intensification.'
