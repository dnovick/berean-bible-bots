name: ch29-hiphil-passive-drill
description: '*BBH Chapter 29 · Hophal Weak Verbs*


  A 25-item drill covering all eight weak-root classes. For each Hophal form,
  students (1) give the active Hiphil/Piel/Qal meaning and (2) translate the Hophal
  passive form in context. Reinforces the core principle that the Hophal passivizes
  its active causative or factitive counterpart, and builds facility with the prefix
  vowels of each weak class.


  Classes represented: I-י/ו, Biconsonantal, III-ה, I-נ, I-guttural, III-ח/ע,
  III-א, Geminate.


