name: ch33-function-sort
description: 'An 18-item exercise reinforcing the Piel–Pual semantic relationship
  using weak roots. Mirrors the Ch32 Function Sort in format but uses III-ה, I-guttural,
  and guttural-R2 roots exclusively. For each Pual form, students supply (1) the Piel
  active meaning and (2) the Pual passive translation.


  Forms span perfect (3ms, 3fs, 3cp), imperfect (3ms), and participle (ms). The variety
  of conjugations reinforces the full set of III-ה endings and guttural-R2 compensatory
  patterns.'
