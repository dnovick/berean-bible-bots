name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml PyJWT cryptography requests

      - name: Run content validators
        id: checks
        run: |
          FAILED=0
          BODY=""

          if ! python scripts/validate_courses.py > /tmp/courses.txt 2>&1; then
            FAILED=1
            BODY="${BODY}
          ### validate_courses
          $(cat /tmp/courses.txt)"
          fi

          if ! python scripts/validate_lessons.py > /tmp/lessons.txt 2>&1; then
            FAILED=1
            BODY="${BODY}
          ### validate_lessons
          $(cat /tmp/lessons.txt)"
          fi

          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          {
            echo "body<<REVIEW_BODY_EOF"
            echo "${BODY}"
            echo "REVIEW_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate reviewer token
        id: reviewer-token
        env:
          REVIEWER_APP_ID: ${{ secrets.REVIEWER_01_APP_ID }}
          REVIEWER_PRIVATE_KEY: ${{ secrets.REVIEWER_01_PRIVATE_KEY }}
          REVIEWER_INSTALLATION_ID: ${{ secrets.REVIEWER_01_INSTALLATION_ID }}
        run: |
          printf '%s' "$REVIEWER_PRIVATE_KEY" > /tmp/reviewer.pem
          TOKEN=$(REVIEWER_PRIVATE_KEY_PATH=/tmp/reviewer.pem \
            python scripts/github_app_token.py --role reviewer)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          rm -f /tmp/reviewer.pem

      - name: Approve PR
        if: steps.checks.outputs.failed == '0'
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} \
            --approve \
            --body "All automated checks passed (flake8, mypy, validate_courses, validate_lessons)."

      - name: Request changes
        if: steps.checks.outputs.failed != '0'
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} \
            --request-changes \
            --body "Automated checks failed. Fix the issues below and push a new commit.${{ steps.checks.outputs.body }}"
