stanzas:
- num: 1
  letter: א
  name: Alef
  verses:
  - num: 1
    abs_num: 1
    hebrew: אַשְׁרֵי תְמִימֵי־דָרֶךְ הַהֹלְכִים בְּתוֹרַת יְהוָה׃
    kjv: Blessed are the undefiled in the way, who walk in the law of the Lord.
    first_word: אַשְׁרֵי
    key_words:
    - הַהֹלְכִים
    - תְמִימֵי
    - בְּתוֹרַת
    line_endings:
    - יְהוָה
  - num: 2
    abs_num: 2
    hebrew: אַשְׁרֵי נֹצְרֵי עֵדֹתָיו בְּכָל־לֵב יִדְרְשׁוּהוּ׃
    kjv: Blessed are they that keep his testimonies, and that seek him with the whole heart.
    first_word: אַשְׁרֵי
    key_words:
    - יִדְרְשׁוּהוּ
    - עֵדֹתָיו
    - אַשְׁרֵי
    line_endings:
    - יִדְרְשׁוּהוּ
  - num: 3
    abs_num: 3
    hebrew: אַף לֹא־פָעֲלוּ עַוְלָה בִּדְרָכָיו הָלָכוּ׃
    kjv: 'They also do no iniquity: they walk in his ways.'
    first_word: אַף
    key_words:
    - בִּדְרָכָיו
    - פָעֲלוּ
    - עַוְלָה
    line_endings:
    - הָלָכוּ
  - num: 4
    abs_num: 4
    hebrew: אַתָּה צִוִּיתָה פִקֻּדֶיךָ לִשְׁמֹר מְאֹד׃
    kjv: Thou hast commanded us to keep thy precepts diligently.
    first_word: אַתָּה
    key_words:
    - צִוִּיתָה
    - פִקֻּדֶיךָ
    - לִשְׁמֹר
    line_endings:
    - מְאֹד
  - num: 5
    abs_num: 5
    hebrew: אַחֲלַי יִכֹּנוּ דְרָכָי לִשְׁמֹר חֻקֶּיךָ׃
    kjv: O that my ways were directed to keep thy statutes!
    first_word: אַחֲלַי
    key_words:
    - אַחֲלַי
    - יִכֹּנוּ
    - דְרָכָי
    line_endings:
    - חֻקֶּיךָ
  - num: 6
    abs_num: 6
    hebrew: אָז לֹא־אֵבוֹשׁ בְּהַבִּיטִי אֶל־כָּל־מִצְוֹתֶיךָ׃
    kjv: Then shall I not be ashamed, when I have respect unto all thy commandments.
    first_word: אָז
    key_words:
    - בְּהַבִּיטִי
    - מִצְוֹתֶיךָ
    - אֵבוֹשׁ
    line_endings:
    - מִצְוֹתֶיךָ
  - num: 7
    abs_num: 7
    hebrew: אוֹדְךָ בְּיֹשֶׁר לֵבָב בְּלָמְדִי מִשְׁפְּטֵי צִדְקֶךָ׃
    kjv: I will praise thee with uprightness of heart, when I shall have learned thy righteous judgments.
    first_word: אוֹדְךָ
    key_words:
    - בְּלָמְדִי
    - מִשְׁפְּטֵי
    - אוֹדְךָ
    line_endings:
    - צִדְקֶךָ
  - num: 8
    abs_num: 8
    hebrew: אֶת־חֻקֶּיךָ אֶשְׁמֹר אַל־תַּעַזְבֵנִי עַד־מְאֹד׃
    kjv: 'I will keep thy statutes: O forsake me not utterly.'
    first_word: אֶת־
    key_words:
    - תַּעַזְבֵנִי
    - חֻקֶּיךָ
    - אֶשְׁמֹר
    line_endings:
    - מְאֹד
- num: 2
  letter: ב
  name: Bet
  verses:
  - num: 1
    abs_num: 9
    hebrew: בַּמֶּה יְזַכֶּה־נַּעַר אֶת־אָרְחוֹ לִשְׁמֹר כִּדְבָרֶךָ׃
    kjv: Wherewithal shall a young man cleanse his way? by taking heed thereto according to thy word.
    first_word: בַּמֶּה
    key_words:
    - כִּדְבָרֶךָ
    - יְזַכֶּה
    - אָרְחוֹ
    line_endings:
    - כִּדְבָרֶךָ
  - num: 2
    abs_num: 10
    hebrew: בְּכָל־לִבִּי דְרַשְׁתִּיךָ אַל־תַּשְׁגֵּנִי מִמִּצְוֹתֶיךָ׃
    kjv: 'With my whole heart have I sought thee: O let me not wander from thy commandments.'
    first_word: בְּכָל־
    key_words:
    - מִמִּצְוֹתֶיךָ
    - דְרַשְׁתִּיךָ
    - תַּשְׁגֵּנִי
    line_endings:
    - מִמִּצְוֹתֶיךָ
  - num: 3
    abs_num: 11
    hebrew: בְּלִבִּי צָפַנְתִּי אִמְרָתֶךָ לְמַעַן לֹא אֶחֱטָא־לָךְ׃
    kjv: Thy word have I hid in mine heart, that I might not sin against thee.
    first_word: בְּלִבִּי
    key_words:
    - צָפַנְתִּי
    - אִמְרָתֶךָ
    - בְּלִבִּי
    line_endings:
    - לָךְ
  - num: 4
    abs_num: 12
    hebrew: בָּרוּךְ אַתָּה יְהוָה לַמְּדֵנִי חֻקֶּיךָ׃
    kjv: 'Blessed art thou, O Lord: teach me thy statutes.'
    first_word: בָּרוּךְ
    key_words:
    - לַמְּדֵנִי
    - בָּרוּךְ
    - יְהוָה
    line_endings:
    - חֻקֶּיךָ
  - num: 5
    abs_num: 13
    hebrew: בִּשְׂפָתַי סִפַּרְתִּי כֹּל מִשְׁפְּטֵי־פִיךָ׃
    kjv: With my lips have I declared all the judgments of thy mouth.
    first_word: בִּשְׂפָתַי
    key_words:
    - בִּשְׂפָתַי
    - סִפַּרְתִּי
    - מִשְׁפְּטֵי
    line_endings:
    - פִיךָ
  - num: 6
    abs_num: 14
    hebrew: בְּדֶרֶךְ עֵדְוֹתֶיךָ שַׂשְׂתִּי כְּעַל כָּל־הוֹן׃
    kjv: I have rejoiced in the way of thy testimonies, as much as in all riches.
    first_word: בְּדֶרֶךְ
    key_words:
    - עֵדְוֹתֶיךָ
    - בְּדֶרֶךְ
    - שַׂשְׂתִּי
    line_endings:
    - הוֹן
  - num: 7
    abs_num: 15
    hebrew: בְּפִקֻּדֶיךָ אָשִׂיחָה וְאַבִּיטָה אֹרְחֹתֶיךָ׃
    kjv: I will meditate in thy precepts, and have respect unto thy ways.
    first_word: בְּפִקֻּדֶיךָ
    key_words:
    - בְּפִקֻּדֶיךָ
    - וְאַבִּיטָה
    - אֹרְחֹתֶיךָ
    line_endings:
    - אֹרְחֹתֶיךָ
  - num: 8
    abs_num: 16
    hebrew: בְּחֻקֹּתֶיךָ אֶשְׁתַּעֲשָׁע לֹא אֶשְׁכַּח דְּבָרֶךָ׃
    kjv: 'I will delight myself in thy statutes: I will not forget thy word.'
    first_word: בְּחֻקֹּתֶיךָ
    key_words:
    - בְּחֻקֹּתֶיךָ
    - אֶשְׁתַּעֲשָׁע
    - אֶשְׁכַּח
    line_endings:
    - דְּבָרֶךָ
- num: 3
  letter: ג
  name: Gimel
  verses:
  - num: 1
    abs_num: 17
    hebrew: גְּמֹל עַל־עַבְדְּךָ אֶחְיֶה וְאֶשְׁמְרָה דְבָרֶךָ׃
    kjv: Deal bountifully with thy servant, that I may live, and keep thy word.
    first_word: גְּמֹל
    key_words:
    - וְאֶשְׁמְרָה
    - עַבְדְּךָ
    - אֶחְיֶה
    line_endings:
    - דְבָרֶךָ
  - num: 2
    abs_num: 18
    hebrew: גַּל־עֵינַי וְאַבִּיטָה נִפְלָאוֹת מִתּוֹרָתֶךָ׃
    kjv: Open thou mine eyes, that I may behold wondrous things out of thy law.
    first_word: גַּל־
    key_words:
    - וְאַבִּיטָה
    - נִפְלָאוֹת
    - מִתּוֹרָתֶךָ
    line_endings:
    - מִתּוֹרָתֶךָ
  - num: 3
    abs_num: 19
    hebrew: גֵּר אָנֹכִי בָאָרֶץ אַל־תַּסְתֵּר מִמֶּנִּי מִצְוֹתֶיךָ׃
    kjv: 'I am a stranger in the earth: hide not thy commandments from me.'
    first_word: גֵּר
    key_words:
    - מִצְוֹתֶיךָ
    - אָנֹכִי
    - בָאָרֶץ
    line_endings:
    - מִצְוֹתֶיךָ
  - num: 4
    abs_num: 20
    hebrew: גָּרְסָה נַפְשִׁי לְתַאֲבָה אֶל־מִשְׁפָּטֶיךָ בְכָל־עֵת׃
    kjv: My soul breaketh for the longing that it hath unto thy judgments at all times.
    first_word: גָּרְסָה
    key_words:
    - מִשְׁפָּטֶיךָ
    - לְתַאֲבָה
    - גָּרְסָה
    line_endings:
    - עֵת
  - num: 5
    abs_num: 21
    hebrew: גָּעַרְתָּ זֵדִים אֲרוּרִים הַשֹּׁגִים מִמִּצְוֹתֶיךָ׃
    kjv: Thou hast rebuked the proud that are cursed, which do err from thy commandments.
    first_word: גָּעַרְתָּ
    key_words:
    - מִמִּצְוֹתֶיךָ
    - אֲרוּרִים
    - הַשֹּׁגִים
    line_endings:
    - מִמִּצְוֹתֶיךָ
  - num: 6
    abs_num: 22
    hebrew: גַּל מֵעָלַי חֶרְפָּה וָבוּז כִּי עֵדֹתֶיךָ נָצָרְתִּי׃
    kjv: Remove from me reproach and contempt; for I have kept thy testimonies.
    first_word: גַּל
    key_words:
    - עֵדֹתֶיךָ
    - נָצָרְתִּי
    - מֵעָלַי
    line_endings:
    - נָצָרְתִּי
  - num: 7
    abs_num: 23
    hebrew: גַּם יָשְׁבוּ שָׂרִים בִּי נִדְבָּרוּ עַבְדְּךָ יָשִׂיחַ בְּחֻקֶּיךָ׃
    kjv: 'Princes also did sit and speak against me: but thy servant did meditate in thy statutes.'
    first_word: גַּם
    key_words:
    - נִדְבָּרוּ
    - בְּחֻקֶּיךָ
    - יָשְׁבוּ
    line_endings:
    - בְּחֻקֶּיךָ
  - num: 8
    abs_num: 24
    hebrew: גַּם־עֵדֹתֶיךָ שַׁעֲשֻׁעָי אַנְשֵׁי עֲצָתִי׃
    kjv: Thy testimonies also are my delight and my counsellors.
    first_word: גַּם־
    key_words:
    - עֵדֹתֶיךָ
    - שַׁעֲשֻׁעָי
    - אַנְשֵׁי
    line_endings:
    - עֲצָתִי
- num: 4
  letter: ד
  name: Dalet
  verses:
  - num: 1
    abs_num: 25
    hebrew: דָּבְקָה לֶעָפָר נַפְשִׁי חַיֵּנִי כִּדְבָרֶךָ׃
    kjv: 'My soul cleaveth unto the dust: quicken thou me according to thy word.'
    first_word: דָּבְקָה
    key_words:
    - כִּדְבָרֶךָ
    - דָּבְקָה
    - לֶעָפָר
    line_endings:
    - כִּדְבָרֶךָ
  - num: 2
    abs_num: 26
    hebrew: דְּרָכַי סִפַּרְתִּי וַתַּעֲנֵנִי לַמְּדֵנִי חֻקֶּיךָ׃
    kjv: 'I have declared my ways, and thou heardest me: teach me thy statutes.'
    first_word: דְּרָכַי
    key_words:
    - וַתַּעֲנֵנִי
    - סִפַּרְתִּי
    - לַמְּדֵנִי
    line_endings:
    - חֻקֶּיךָ
  - num: 3
    abs_num: 27
    hebrew: דֶּרֶךְ־פִּקּוּדֶיךָ הֲבִינֵנִי וְאָשִׂיחָה בְּנִפְלְאוֹתֶיךָ׃
    kjv: 'Make me to understand the way of thy precepts: so shall I talk of thy wondrous works.'
    first_word: דֶּרֶךְ־
    key_words:
    - בְּנִפְלְאוֹתֶיךָ
    - פִּקּוּדֶיךָ
    - הֲבִינֵנִי
    line_endings:
    - בְּנִפְלְאוֹתֶיךָ
  - num: 4
    abs_num: 28
    hebrew: דָּלְפָה נַפְשִׁי מִתּוּגָה קַיְּמֵנִי כִּדְבָרֶךָ׃
    kjv: 'My soul melteth for heaviness: strengthen thou me according unto thy word.'
    first_word: דָּלְפָה
    key_words:
    - מִתּוּגָה
    - קַיְּמֵנִי
    - כִּדְבָרֶךָ
    line_endings:
    - כִּדְבָרֶךָ
  - num: 5
    abs_num: 29
    hebrew: דֶּרֶךְ־שֶׁקֶר הָסֵר מִמֶּנִּי וְתוֹרָתְךָ חָנֵּנִי׃
    kjv: 'Remove from me the way of lying: and grant me thy law graciously.'
    first_word: דֶּרֶךְ־
    key_words:
    - וְתוֹרָתְךָ
    - מִמֶּנִּי
    - חָנֵּנִי
    line_endings:
    - חָנֵּנִי
  - num: 6
    abs_num: 30
    hebrew: דֶּרֶךְ־אֱמוּנָה בָחָרְתִּי מִשְׁפָּטֶיךָ שִׁוִּיתִי׃
    kjv: 'I have chosen the way of truth: thy judgments have I laid before me.'
    first_word: דֶּרֶךְ־
    key_words:
    - מִשְׁפָּטֶיךָ
    - אֱמוּנָה
    - בָחָרְתִּי
    line_endings:
    - שִׁוִּיתִי
  - num: 7
    abs_num: 31
    hebrew: דָּבַקְתִּי בְעֵדְוֹתֶיךָ יְהוָה אַל־תְּבִישֵׁנִי׃
    kjv: 'I have stuck unto thy testimonies: O Lord, put me not to shame.'
    first_word: דָּבַקְתִּי
    key_words:
    - בְעֵדְוֹתֶיךָ
    - תְּבִישֵׁנִי
    - דָּבַקְתִּי
    line_endings:
    - תְּבִישֵׁנִי
  - num: 8
    abs_num: 32
    hebrew: דֶּרֶךְ־מִצְוֹתֶיךָ אָרוּץ כִּי תַרְחִיב לִבִּי׃
    kjv: I will run the way of thy commandments, when thou shalt enlarge my heart.
    first_word: דֶּרֶךְ־
    key_words:
    - מִצְוֹתֶיךָ
    - תַרְחִיב
    - אָרוּץ
    line_endings:
    - לִבִּי
- num: 5
  letter: ה
  name: He
  verses:
  - num: 1
    abs_num: 33
    hebrew: הוֹרֵנִי יְהוָה דֶּרֶךְ חֻקֶּיךָ וְאֶצְּרֶנָּה עֵקֶב׃
    kjv: Teach me, O Lord, the way of thy statutes; and I shall keep it unto the end.
    first_word: הוֹרֵנִי
    key_words:
    - וְאֶצְּרֶנָּה
    - הוֹרֵנִי
    - יְהוָה
    line_endings:
    - עֵקֶב
  - num: 2
    abs_num: 34
    hebrew: הֲבִינֵנִי וְאֶצְּרָה תוֹרָתֶךָ וְאֶשְׁמְרֶנָּה בְכָל־לֵב׃
    kjv: Give me understanding, and I shall keep thy law; yea, I shall observe it with my whole heart.
    first_word: הֲבִינֵנִי
    key_words:
    - וְאֶשְׁמְרֶנָּה
    - הֲבִינֵנִי
    - וְאֶצְּרָה
    line_endings:
    - לֵב
  - num: 3
    abs_num: 35
    hebrew: הַדְרִיכֵנִי בִּנְתִיב מִצְוֹתֶיךָ כִּי־בוֹ חָפָצְתִּי׃
    kjv: Make me to go in the path of thy commandments; for therein do I delight.
    first_word: הַדְרִיכֵנִי
    key_words:
    - הַדְרִיכֵנִי
    - מִצְוֹתֶיךָ
