name: Present vs. Aorist Adverbial Participle Contrast
description: A 20-item contrast drill presenting adverbial participial clauses from
  or modeled on GNT passages. Students classify the temporal relation as CONTEMP (present
  participle = same time as main verb) or ANTEC (aorist participle = prior to main
  verb), parse tense and voice, supply the lexical form, and translate. The exercise
  includes 10 present and 10 aorist adverbial participles, including two aorist passive
  deponents (ἀποκρίνομαι, ἐγείρω) that require contextual disambiguation. Discussion
  questions address deponent passives, the limits of the contemporaneous/antecedent
  rule, and the nuance of matching participle tense to context. An answer key is embedded
  in all three formats.
