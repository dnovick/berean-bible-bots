name: ch33-qal-piel-pual-contrast
description: A 15-item triplet drill showing the same weak root in Qal, Piel, and
  Pual side by side. Identical in format to the Ch32 contrast drill, but all roots
  are weak. Students identify the stem and translate each form, attending carefully
  to how weak-root changes (III-ה endings, guttural compensatory lengthening) interact
  with the Pual stem markers.
