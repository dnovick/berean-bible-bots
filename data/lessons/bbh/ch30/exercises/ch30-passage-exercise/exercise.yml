name: '"Spot the Piel" — Chapter 30 Passage Exercise'
description: 'Students identify and parse Piel Strong verbs across three Torah passages:
  Genesis 1:22, 28 (God''s blessing of creation), Exodus 19:10–14 (preparation for
  Sinai theophany), and Numbers 22:6–8, 17–18 (Balak and Balaam). The exercise presents
  16 verbs: 12 Piel, 1 Pual distractor (preview of Ch32), and 3 Qal distractors that
  lack Dagesh Forte in R2. Students indicate whether each verb is Piel, then parse
  Conjugation/PGN/Root and supply the semantic Function type.'
