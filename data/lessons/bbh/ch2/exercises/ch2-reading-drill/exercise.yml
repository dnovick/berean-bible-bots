name: '"Consonant-Vowel Reading Drill" — Sight Reading Practice'
description: 15-row × 10-syllable reading drill covering all Hebrew vowel types from
  Chapter 2, including matres lectionis and Hateph (composite) shewas. Each row uses
  one consonant (Bet, Mem, Shin, Lamed, Nun, Dalet, Alef, Kaf, He, Pe, Taw, Resh,
  Gimel, Ayin, Tsade) paired with ten vowels in randomized order. The instructor
  calls on students to read a row aloud; the interactive HTML reveals vowel names
  for grading.
