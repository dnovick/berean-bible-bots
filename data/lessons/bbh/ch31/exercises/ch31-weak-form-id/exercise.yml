name: '"Weak-Form Identification Drill" — Exercise'
description: A 30-item identification and parsing exercise covering four Piel weak
  classes (III-he, I-guttural, Geminate, I-nun). Part A (items 1–20) groups forms
  by class — five items per class — so students can build class-by-class recognition
  before mixing. Part B (items 21–30) presents forms from multiple classes in random
  order; students must identify the weak class first, then parse. Answer keys for
  both parts include the diagnostic marker that reveals the weak class. Four discussion
  questions focus on the distinctive behavior of each class within the Piel stem.
